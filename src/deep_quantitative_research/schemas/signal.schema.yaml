$schema: "http://json-schema.org/draft-07/schema#"
title: SignalSpec
description: |
  Connects hypothesis, datasets, features, backtest, and validation into a
  single runnable specification. Spec section 9.
type: object
required: [signal_id, signal_name, hypothesis, target, predictors, feature_grid, validation, outputs]
properties:
  signal_id:
    type: string
    pattern: "^[a-z0-9-]+$"
  signal_name:
    type: string
  hypothesis:
    type: object
    required: [statement, target_variable]
    properties:
      statement: {type: string}
      expected_direction:
        enum: [positive, negative, non-monotonic]
      target_variable: {type: string}
      expected_lag_periods:
        type: array
        items: {type: integer, minimum: 0}
  target:
    type: object
    required: [dataset_id, field, cadence]
    properties:
      dataset_id: {type: string}
      field: {type: string}
      cadence:
        enum: [daily, weekly, monthly, quarterly, annual, irregular]
      transform:
        type: [string, "null"]
  predictors:
    type: array
    minItems: 1
    items:
      type: object
      required: [dataset_id, field, cadence]
      properties:
        dataset_id: {type: string}
        field: {type: string}
        cadence:
          enum: [daily, weekly, monthly, quarterly, annual, irregular]
        variable_type:
          enum: [flow, stock, rate, price, count, sentiment, event]
        default_aggregation:
          enum: [sum, mean, last, max, min, median]
        transforms:
          type: array
          items: {type: string}
        lags:
          type: array
          items: {type: integer, minimum: 0}
  join_logic:
    type: object
    properties:
      join_keys:
        type: array
        items: {type: string}
      time_alignment: {type: string}
      release_lag_policy: {type: string}
  feature_grid:
    type: object
    required: [mode, max_features, max_lags]
    properties:
      mode:
        enum: [controlled, exhaustive]
      max_features: {type: integer, minimum: 1}
      max_lags: {type: integer, minimum: 0}
      multiple_testing_correction: {type: boolean}
      pre_specified_feature:
        type: [string, "null"]
  validation:
    type: object
    required: [train_period, test_period]
    properties:
      train_period: {type: string}  # YYYY-MM-DD/YYYY-MM-DD
      test_period: {type: string}
      walk_forward: {type: boolean}
      regime_split: {type: boolean}
  outputs:
    type: object
    properties:
      signal_card: {type: boolean}
      dashboard: {type: boolean}
      experiment_log: {type: boolean}
