[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-quantitative-research"
version = "3.0.0.dev0"
description = "Registry-aware quantitative research engine: hypothesis to signal card with dataset contracts, cadence-safe rollups, controlled feature grids, walk-forward backtesting, and reproducible signal dashboards."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "Stephanie Galindo"}]
keywords = ["quantitative-research", "signals", "backtesting", "biotech", "finance", "macro"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  "pandas>=2.1,<3.0",
  "numpy>=1.26,<3.0",
  "scipy>=1.11,<2.0",
  "statsmodels>=0.14,<1.0",
  "yfinance>=0.2.40,<1.0",
  "requests>=2.31,<3.0",
  "pyyaml>=6.0,<7.0",
  # matplotlib pinned to a minor series because the biotech-pos and
  # null-control demos embed matplotlib PNG bytes in dashboard.html;
  # pinning narrows the byte-level drift across CI runs. Bump on
  # purpose when regenerating expected-output.
  "matplotlib~=3.10.9",
  "duckdb>=1.0,<2.0",
  "click>=8.1,<9.0",
  "jsonschema>=4.21,<5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=4.1,<6.0",
  "ruff>=0.4,<1.0",
  "mypy>=1.8,<2.0",
]

[project.scripts]
"deep-quant" = "deep_quantitative_research.cli:main"

[project.urls]
Homepage = "https://github.com/stephbeccag/deep-quantitative-research"
Issues = "https://github.com/stephbeccag/deep-quantitative-research/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: hits external APIs; skipped by default",
]

[tool.ruff]
line-length = 100
target-version = "py310"
