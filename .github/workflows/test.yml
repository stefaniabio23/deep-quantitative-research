name: Tests

on:
  push:
    branches: [main, "v3-*"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest -q --strict-markers

      - name: Compile-check src/
        run: |
          find src -name "*.py" -print0 | xargs -0 python -m py_compile

      - name: Compile-check tests/
        run: |
          find tests -name "*.py" -print0 | xargs -0 python -m py_compile

  demo-smoke:
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        # Pinned to the version the committed expected-output was generated on.
        # Bump only when regenerating the expected-output bundle.
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run biotech-pos demo (planted signal)
        run: ./examples/biotech-pos/run.sh

      - name: Run null-control demo (negative control)
        run: ./examples/null-control/run.sh

      - name: Verify expected artefacts exist for both demos
        run: |
          set -euo pipefail
          for demo in biotech-pos null-control; do
            for f in run.yaml cadence-rollup-audit.yaml feature-grid.yaml \
                     feature-search-log.yaml backtest-result.yaml \
                     validation-report.yaml signal-card.md dashboard.html; do
              test -s "examples/${demo}/expected-output/${f}" \
                || { echo "missing or empty: ${demo}/${f}"; exit 1; }
            done
          done

      - name: Verify both demo headlines stay honest
        # The planted-signal demo must pass (cap=medium, OOS survives, lag_1
        # picked) and the negative-control demo must fail (cap=low, spurious,
        # OOS does not survive). A regression in either direction is a real
        # bug: signal recovery weakening, or noise being mistaken for signal.
        run: |
          set -euo pipefail
          python - <<'PY'
          import yaml

          # Planted-signal demo
          br = yaml.safe_load(open('examples/biotech-pos/expected-output/backtest-result.yaml'))
          vr = yaml.safe_load(open('examples/biotech-pos/expected-output/validation-report.yaml'))
          assert br['best_feature'] == 'aact::raw::lag_1', br['best_feature']
          assert br['verdict']['survives_oos'] is True, br['verdict']
          assert vr['confidence_cap'] == 'medium', vr['confidence_cap']
          assert vr['binding_constraint'] == 'sample_size', vr['binding_constraint']
          assert vr['relationship_type'] in {'proxy', 'causal'}, vr['relationship_type']
          print('biotech-pos: planted signal correctly recovered.')

          # Negative-control demo
          nbr = yaml.safe_load(open('examples/null-control/expected-output/backtest-result.yaml'))
          nvr = yaml.safe_load(open('examples/null-control/expected-output/validation-report.yaml'))
          assert nbr['verdict']['survives_oos'] is False, nbr['verdict']
          assert nvr['confidence_cap'] == 'low', nvr['confidence_cap']
          assert nvr['relationship_type'] == 'spurious', nvr['relationship_type']
          # Binding constraint can be multiple_testing or out_of_sample; both
          # are honest reads of "this is noise".
          assert nvr['binding_constraint'] in {
              'multiple_testing', 'out_of_sample', 'sample_size',
          }, nvr['binding_constraint']
          print('null-control: noise correctly rejected.')
          PY

  project-self-tests:
    # The projects/ studies hit external networks in a full run, so they are
    # not CI-run, but each ships a synthetic --self-test that validates its
    # methodology offline. Guard those so the engines can't silently break.
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Reference-class engine self-test
        run: python projects/catalyst-reference-class/run_reference_class.py --self-test
      - name: Open Targets enrichment parser self-test
        run: python projects/catalyst-reference-class/enrich_opentargets.py --self-test
      - name: CT.gov outcome-labeling parser self-test
        run: python projects/catalyst-reference-class/outcome_ctgov.py --self-test
      - name: Sell-the-news event-study self-test
        run: python projects/biotech-sell-the-news/run_sell_the_news.py --self-test
      - name: ALFRED revision-momentum self-test
        run: python projects/alfred-revision-momentum/run_revision_momentum.py --self-test

  gitleaks:
    # Secret-scan the full history on every push/PR (mirrors the local
    # pre-commit hook). Self-contained binary install, no action license.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install and run gitleaks
        run: |
          VERSION=8.30.0
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --no-banner --redact
