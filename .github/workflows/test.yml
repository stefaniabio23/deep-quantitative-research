name: Tests

on:
  push:
    branches: [main, "v3-*"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest -q --strict-markers

      - name: Compile-check src/
        run: |
          find src -name "*.py" -print0 | xargs -0 python -m py_compile

      - name: Compile-check tests/
        run: |
          find tests -name "*.py" -print0 | xargs -0 python -m py_compile

  demo-smoke:
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        # Pinned to the version the committed expected-output was generated on.
        # Bump only when regenerating the expected-output bundle.
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run biotech-pos demo
        run: ./examples/biotech-pos/run.sh

      - name: Verify expected artefacts exist
        run: |
          set -euo pipefail
          for f in run.yaml cadence-rollup-audit.yaml feature-grid.yaml \
                   feature-search-log.yaml backtest-result.yaml \
                   validation-report.yaml signal-card.md dashboard.html; do
            test -s "examples/biotech-pos/expected-output/${f}" \
              || { echo "missing or empty: ${f}"; exit 1; }
          done

      - name: Verify demo headline result is unchanged
        # Byte-level diff is too strict (matplotlib PNG bytes and timestamp
        # fields drift across runs). Assert the values the validation gate
        # is supposed to produce.
        run: |
          set -euo pipefail
          python - <<'PY'
          import yaml
          br = yaml.safe_load(open('examples/biotech-pos/expected-output/backtest-result.yaml'))
          vr = yaml.safe_load(open('examples/biotech-pos/expected-output/validation-report.yaml'))
          assert br['best_feature'] == 'aact::raw::lag_1', br['best_feature']
          assert br['verdict']['survives_oos'] is True, br['verdict']
          assert vr['confidence_cap'] == 'medium', vr['confidence_cap']
          assert vr['binding_constraint'] == 'sample_size', vr['binding_constraint']
          print('demo headline result: OK')
          PY
