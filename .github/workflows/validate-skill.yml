name: Validate Skill

on:
  push:
    paths:
      - "skills/**"
      - "config/**"
      - ".github/scripts/validate_skill.py"
      - ".github/workflows/validate-skill.yml"
  pull_request:
    paths:
      - "skills/**"
      - "config/**"
      - ".github/scripts/validate_skill.py"
      - ".github/workflows/validate-skill.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Validate every SKILL.md frontmatter
        run: python .github/scripts/validate_skill.py

      - name: Check canonical agents exist
        run: |
          set -euo pipefail
          required_agents=(
            "research-architect"
            "backtest-engine"
            "data-scout-quality"
            "causal-skeptic"
            "findings-evaluator"
            "report-compiler"
            "analysis-engine"
          )
          for agent in "${required_agents[@]}"; do
            f="skills/deep-quantitative-research/agents/${agent}.md"
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
            echo "OK: $f"
          done

      - name: Check canonical sub-skills exist
        run: |
          set -euo pipefail
          required_skills=(
            "hypothesis-formulation"
            "datasource-query"
            "dataset-selection"
            "dataset-contract"
            "cadence-roll-up"
            "feature-engineering"
            "time-series-backtest"
            "statistical-validation"
            "causal-inference"
            "signal-synthesis"
            "visual-display"
            "dashboard-builder"
          )
          for skill in "${required_skills[@]}"; do
            f="skills/deep-quantitative-research/skills/${skill}/SKILL.md"
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
            echo "OK: $f"
          done

      - name: Check config files exist
        run: |
          set -euo pipefail
          required=(
            "config/datasources.yaml"
            "config/research_defaults.yaml"
            "config/scoring_weights.yaml"
            "config/validation_thresholds.yaml"
          )
          for f in "${required[@]}"; do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
            echo "OK: $f"
          done

      - name: Check templates and references present
        run: |
          set -euo pipefail
          ls skills/deep-quantitative-research/templates/*.md > /dev/null
          ls skills/deep-quantitative-research/references/*.md > /dev/null
          echo "templates/ and references/ populated"
